# Builds the installers for all three platforms. Run it from the Actions tab
# ("Run workflow") or push a v* tag, then download the per-OS artifacts:
#   InterviewCopilot-Windows  ->  .exe (NSIS installer, x64)
#   InterviewCopilot-macOS    ->  .dmg + .zip per architecture (arm64, x64)
#   InterviewCopilot-Linux    ->  .AppImage + .deb (x64)
#
# The macOS build is unsigned unless you add a Developer ID certificate as
# secrets (CSC_LINK = base64 .p12, CSC_KEY_PASSWORD), and notarized only when
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set too — see the
# README for what an unsigned build means for people installing it.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifact: InterviewCopilot-Windows
            files: dist/*.exe
          - name: macOS
            os: macos-14
            script: dist:mac
            artifact: InterviewCopilot-macOS
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-22.04
            script: dist:linux
            artifact: InterviewCopilot-Linux
            files: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (${{ matrix.name }})
        run: npm run ${{ matrix.script }}
        env:
          # Skip code-signing lookup when no certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (needs a Developer ID certificate in CSC_LINK):
          # Apple ID, an app-specific password for it, and the team id.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
